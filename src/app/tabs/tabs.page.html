<ion-tabs>
  <ion-tab-bar slot="bottom" class="cne-tab-bar">
    @for (item of tabsDisponibles(); track item.tab) {
      <ion-tab-button [tab]="item.tab" [href]="'/tabs/' + item.tab">
        <ion-icon [name]="item.icon"></ion-icon>
        <ion-label>{{ item.label }}</ion-label>
      </ion-tab-button>
    }
  </ion-tab-bar>
</ion-tabs>
